<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARIA - Admin Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/auth.css" />
  <link rel="stylesheet" href="/admin.css" />
</head>
<body>

<!-- ══════════════════ LOGIN SCREEN ══════════════════ -->
<div class="auth-page" id="admin-login-screen">
  <div class="auth-right" style="width:100%;">
    <div class="auth-card">
      <div class="auth-panel active">
        <div class="admin-login-brand">
          <div class="al-logo"><img src="/dabur-logo.svg" alt="Dabur" class="brand-logo-img" /></div>
          <span class="admin-login-brand-name">ARIA Admin</span>
        </div>
        <div class="panel-header">
          <h2>Admin sign in</h2>
          <p>Restricted to the super-admin account</p>
        </div>
        <form id="form-admin-login" onsubmit="handleAdminLogin(event)">
          <div class="field">
            <label for="admin-email">Email</label>
            <div class="input-wrap">
              <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <input type="email" id="admin-email" placeholder="admin@example.com" autocomplete="email" required />
            </div>
          </div>
          <div class="field">
            <label for="admin-password">Password</label>
            <div class="input-wrap">
              <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="admin-password" placeholder="••••••••" autocomplete="current-password" required />
            </div>
          </div>
          <div id="admin-login-error" class="form-error hidden"></div>
          <button type="submit" class="submit-btn" id="btn-admin-login">
            <span class="btn-label">Sign In</span>
            <span class="btn-spinner hidden"></span>
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- ══════════════════ DASHBOARD ══════════════════ -->
<div class="admin-dashboard hidden" id="admin-dashboard">

  <header class="admin-header">
    <div class="admin-header-left">
      <img src="/dabur-logo.svg" alt="Dabur" class="admin-logo-img" />
      <span class="admin-title">Knowledge Bases</span>
    </div>
    <div class="admin-header-right">
      <button class="admin-btn admin-btn-primary" onclick="openCreateModal()">+ New Knowledge Base</button>
      <button class="admin-icon-btn" id="admin-theme-toggle" title="Toggle dark mode"></button>
      <button class="admin-icon-btn" onclick="adminLogout()" title="Sign out">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </header>

  <main class="admin-main">
    <div id="kb-empty" class="kb-empty hidden">
      <p>No knowledge bases yet.</p>
      <button class="admin-btn admin-btn-primary" onclick="openCreateModal()">Create your first one</button>
    </div>
    <div id="kb-grid" class="kb-grid"></div>
  </main>

</div>

<!-- ── Create KB modal ── -->
<div class="admin-modal-backdrop hidden" id="create-modal-backdrop">
  <div class="admin-modal">
    <h3>New Knowledge Base</h3>
    <form id="form-create-kb" onsubmit="handleCreateKb(event)">
      <div class="field">
        <label for="kb-name">Name</label>
        <div class="input-wrap"><input type="text" id="kb-name" placeholder="e.g. HR Policies" required /></div>
      </div>
      <div class="field">
        <label for="kb-description">Description</label>
        <div class="input-wrap"><input type="text" id="kb-description" placeholder="What this knowledge base covers" /></div>
      </div>
      <div id="create-kb-error" class="form-error hidden"></div>
      <div class="admin-modal-actions">
        <button type="button" class="admin-btn" onclick="closeCreateModal()">Cancel</button>
        <button type="submit" class="admin-btn admin-btn-primary" id="btn-create-kb">Create</button>
      </div>
    </form>
  </div>
</div>

<!-- ── Manage files modal ── -->
<div class="admin-modal-backdrop hidden" id="files-modal-backdrop">
  <div class="admin-modal admin-modal-lg">
    <h3 id="files-modal-title">Files</h3>

    <div class="files-dropzone" id="files-dropzone">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <p>Drag &amp; drop files here, or <label for="files-input" class="files-browse">browse</label></p>
      <input type="file" id="files-input" multiple hidden />
      <span class="files-hint">PDF, DOC, DOCX, TXT, MD, XLSX, XLS, CSV</span>
    </div>

    <div id="files-progress" class="files-progress hidden"></div>

    <table class="files-table">
      <thead><tr><th>Filename</th><th>Size</th><th>Chunks</th><th>Status</th><th>Uploaded</th><th></th></tr></thead>
      <tbody id="files-table-body"></tbody>
    </table>

    <div class="admin-modal-actions">
      <button type="button" class="admin-btn admin-btn-primary" onclick="closeFilesModal()">Done</button>
    </div>
  </div>
</div>

<script src="/admin.js"></script>
</body>
</html>
